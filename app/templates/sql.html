<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL查询助手</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1000px; margin: 0 auto; padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        #questionInput { width: 100%; height: 60px; padding: 10px; font-size: 16px; }
        #resultDisplay { width: 100%; min-height: 300px; padding: 10px; border: 1px solid #ccc; white-space: pre-wrap; }
        .status { color: #666; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SQL自然语言查询助手</h1>
        <textarea id="questionInput" placeholder="请输入您的问题，按回车键提交..."></textarea>
        <div class="status">状态: 就绪</div>
        <h3>查询结果:</h3>
        <div id="resultDisplay"></div>
        <h3>生成的SQL:</h3>
        <pre id="sqlDisplay" style="background-color: #f5f5f5; padding: 10px; border-radius: 4px;"></pre>
    </div>

    <script>
        const input = document.getElementById('questionInput');
        const resultDisplay = document.getElementById('resultDisplay');
        const statusElement = document.querySelector('.status');

        input.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const question = input.value.trim();
                if (!question) return;

                statusElement.textContent = '状态: 处理中...';
                resultDisplay.textContent = '正在生成结果，请稍候...';

                try {
                    const response = await fetch('/api/query', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: question })
                    });

                    const data = await response.json();
                    statusElement.textContent = data.success ? '状态: 完成' : '状态: 出错';
                    resultDisplay.textContent = data.result || data.error;
                    // 显示SQL语句
                    sqlDisplay.textContent = data.sql || '无生成的SQL语句';
                } catch (error) {
                    statusElement.textContent = '状态: 错误';
                    resultDisplay.textContent = '请求失败: ' + error.message;
                }
            }
        });
    </script>
</body>
</html>
