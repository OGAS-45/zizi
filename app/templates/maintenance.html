<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统维护中</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .maintenance-text {
            font-size: 3rem;
            font-weight: bold;
            color: #333;
            text-align: center;
            z-index: 2;
            background-color: rgba(255,255,255,0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .jarvis-bg {
            position: absolute;
            opacity: 0.15;
            z-index: 1;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50%" y="50%" font-size="80" text-anchor="middle" dominant-baseline="middle" fill="%23333">JARVIS</text></svg>');
            background-repeat: repeat;
            background-position: center;
            background-size: 300px;
        }
    </style>
</head>
<body>
    <div class="jarvis-bg"></div>
    <div class="maintenance-text">维护中，维护期间暂不可使用</div>
    <div class="maintenance-text">十五分钟之后再来看看吧</div>
</body>
</html>
